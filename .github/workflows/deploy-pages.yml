name: Deploy site to GitHub Pages

# The live site is a static export. This workflow builds the Umbraco app on
# GitHub's runner, renders every route to HTML, and publishes the result.
# Netlify cannot host Umbraco directly (ephemeral filesystem, no persistent
# database), which is why the CMS is only ever used as a build-time tool.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold runner has to restore NuGet packages, build, install the Umbraco
    # schema into a fresh SQLite file and self-seed before it can export.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This file is git-ignored, so the unattended install needs a throwaway
      # admin here. The runner is ephemeral and never exposed publicly.
      - name: Create development settings
        run: |
          cat > appsettings.Development.json <<'JSON'
          {
            "Serilog": { "MinimumLevel": { "Default": "Warning" } },
            "ConnectionStrings": {
              "umbracoDbDSN": "Data Source=|DataDirectory|/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True",
              "umbracoDbDSN_ProviderName": "Microsoft.Data.Sqlite"
            },
            "Umbraco": {
              "CMS": {
                "Unattended": {
                  "InstallUnattended": true,
                  "UnattendedUserName": "Build",
                  "UnattendedUserEmail": "build@localhost",
                  "UnattendedUserPassword": "BuildOnlyPassword!1",
                  "UnattendedTelemetryLevel": "Minimal"
                },
                "WebRouting": { "UmbracoApplicationUrl": "http://localhost:5099" },
                "Hosting": { "Debug": false }
              }
            }
          }
          JSON

      - name: Build
        run: dotnet build -c Release --nologo

      # Runs first so the real Pages base path is known. It is empty when the
      # site is served from a domain root, and "/champion-4-heroes" for a
      # project site, which is exactly what the export needs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Start the app, let it seed itself, and export
        # GitHub tears down background processes at the end of a `run` step, so the
        # server must be started and used inside this single step.
        run: |
          set +e
          chmod +x ./bin/Release/net10.0/champion-4-heroes

          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://localhost:5099 \
          C4H_FORCE_IMAGE_REFRESH=1 \
            ./bin/Release/net10.0/champion-4-heroes > app.log 2>&1 &
          APP_PID=$!
          echo "app pid $APP_PID"

          READY=0
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:5099/ > /dev/null 2>&1; then
              echo "app is up after $((i * 2))s"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::the app did not start within 6 minutes"
            tail -100 app.log
            exit 1
          fi

          # Passed through the environment so the value never lands inside the
          # shell's own quoting.
          export PAGES_BASE_PATH="${{ steps.pages.outputs.base_path }}"
          echo "base path: '${PAGES_BASE_PATH}'"
          echo "node: $(node --version)"

          node tools/export-static.js "http://localhost:5099" "$PAGES_BASE_PATH"
          STATUS=$?

          echo "export exit status: $STATUS"
          echo "dist entries: $(ls dist 2>/dev/null | wc -l)"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::the static export failed"
            tail -40 app.log
          fi

          kill "$APP_PID" 2>/dev/null
          exit $STATUS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
